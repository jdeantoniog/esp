<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e10">
<title>Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f4f3;
    --surface: #ffffff;
    --ink: #0e0e10;
    --muted: #5c5c60;
    --line: #e0e0dd;
    /* Colores Ogemaw: dorado, gris y negro */
    --t-max: #c2410c;
    --t-min: #1d5fc4;
    --oh-gold: #f4c446;
    --oh-grey: #4c4c4e;
    --oh-black: #0e0e10;
    --oh-on-accent: #f4c446;     /* texto sobre fondo de acento */
    --oh-accent-bg: #0e0e10;     /* fondo de acento */
    --es-red: #aa151b;
    --c-pais: #aa151b;          /* se ajusta desde la bandera del país en config.js */
    --c-usa: #0a3161;
    --es-yellow: #f1bf00;
    --deep-blue: #0a3161;
    --warn: #b31942;
    --ok: #1d7a46;
    --mid: #a76a00;
    --focus: #0a6cff;
    --alert-bg: #fff1f2;
    --cloud: #aab3c5;
    --sun: #f2a900;
    --rain: #2f7de1;
    --snow: #7fa7ff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #161618;
      --surface: #232325;
      --ink: #f2f2f2;
      --muted: #a3a3a8;
      --line: #3a3a3d;
      --oh-on-accent: #0e0e10;
      --oh-accent-bg: #f4c446;
      --t-max: #ff9466;
      --t-min: #7fb2ff;
      --ok: #4cc283;
      --mid: #e0a43a;
      --alert-bg: #3a1a20;
      --cloud: #8590a6;
      --c-usa: #2f5fa8;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1rem; font-weight: 600; color: var(--muted); margin: 0 0 14px; text-align: center; }
  h2 { font-size: 1.15rem; font-weight: 700; margin: 0 0 12px; padding-left: 10px; border-left: 4px solid var(--oh-gold); line-height: 1.2; }
  .card {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Banderas, relojes y tiempo actual ---------- */
  .flags { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px; }
  .flag-block { text-align: center; min-width: 0; }
  .flag {
    display: block; width: 100%; aspect-ratio: 3 / 2; height: auto;
    border-radius: 6px; box-shadow: 0 0 0 1px var(--line);
  }
  .clock {
    font-size: clamp(2rem, 9vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em;
    line-height: 1; margin-top: 12px; font-variant-numeric: tabular-nums;
    display: flex; justify-content: center; align-items: center; gap: 0.18em;
  }
  .wx-ico { display: inline-flex; width: 0.8em; height: 0.8em; flex: none; }
  .wx-ico:empty { display: none; }
  .wx-ico svg { width: 100%; height: 100%; display: block; }
  .clock-place { font-weight: 600; margin-top: 4px; }
  .clock-date { color: var(--muted); font-size: 0.9rem; }
  .clock-wx {
    font-size: 0.85rem; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums;
    line-height: 1.3; min-height: 1.3em;
  }
  .gap[hidden] { display: none; }
  .flags.no-gap { grid-template-columns: 1fr 1fr; gap: 20px; }
  .flags.n1 { grid-template-columns: minmax(0, 260px); justify-content: center; }
  /* Tres banderas (país, lugar extra y segundo país) */
  .flags.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .flags.n3 .clock { font-size: clamp(1.45rem, 7.4vw, 3rem); gap: 0.12em; }
  .flags.n3 .clock-place { font-size: 0.9rem; }
  .flags.n3 .clock-date, .flags.n3 .clock-wx { font-size: 0.74rem; }
  /* Buscador de lugar del tiempo */
  .place-search { display: flex; gap: 6px; margin: 2px 0 8px; }
  .place-search input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  }
  .place-search input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .ps-list { list-style: none; margin: 0 0 10px; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .ps-list li + li { border-top: 1px solid var(--line); }
  .ps-list li.muted, .ps-list li.status { padding: 8px 10px; }
  .ps-opt { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 0; padding: 8px 10px; cursor: pointer; }
  .ps-opt b { display: block; }
  .ps-opt span { font-size: 0.8rem; color: var(--muted); }
  .ps-msg { margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); }
  .ps-msg:empty { display: none; }
  /* Avisos meteorológicos */
  .alert-zone + .alert-zone { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .alert-zone h3 { margin: 0 0 6px; font-size: 0.95rem; }
  .alert-list { list-style: none; margin: 0; padding: 0; }
  .alert-list li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }
  .alert-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; transform: translateY(1px); }
  .alert-dot.amarillo { background: #f2c500; } .alert-dot.naranja { background: #f18b00; } .alert-dot.rojo { background: #e53210; }
  .alert-when { display: block; font-size: 0.78rem; color: var(--muted); }
  /* Noticias */
  .news-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .news-tabs[hidden] { display: none; }
  .news-tabs .chip[aria-pressed="true"] { background: var(--oh-accent-bg); color: var(--oh-on-accent); border-color: var(--oh-accent-bg); }
  .news-list { list-style: none; margin: 0; padding: 0; }
  .news-list li { padding: 9px 0; border-top: 1px solid var(--line); }
  .news-list li:first-child { border-top: 0; }
  .news-list a { color: var(--ink); text-decoration: none; font-weight: 600; line-height: 1.3; }
  .news-list a:hover, .news-list a:focus-visible { text-decoration: underline; }
  .news-meta { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .gap { align-self: center; color: var(--muted); font-size: 0.85rem; text-align: center; white-space: nowrap; }
  .gap strong { display: block; color: var(--ink); font-size: 1.1rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  /* ---------- Cambio de versión (menú al tocar la bandera del país) ---------- */
  .flag-btn[hidden], .flag-block[hidden] { display: none; }
  .flag-btn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 6px; position: relative; }
  .flag-btn .flag-hint { position: absolute; right: 4px; bottom: 4px; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #ffffff; font-size: 0.8rem; line-height: 22px; text-align: center; }
  .ver-menu { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .ver-menu[hidden] { display: none; }
  .ver-opt { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; font-size: 0.9rem; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 6px; cursor: pointer; }
  .ver-opt svg { width: 30px; height: 20px; border-radius: 3px; box-shadow: 0 0 0 1px var(--line); }
  .ver-opt[aria-current="true"] { background: var(--oh-accent-bg); color: var(--oh-on-accent); border-color: var(--oh-accent-bg); }

  /* ---------- Conversor: botones en 2 columnas a la izquierda, resultados a la derecha ---------- */
  .conv { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .conv-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .conv-btn {
    font: inherit; font-size: 0.82rem; font-weight: 700; line-height: 1.15; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 4px; cursor: pointer; min-width: 0; overflow-wrap: anywhere;
  }
  .conv-btn.main { grid-column: 1 / -1; font-size: 0.95rem; padding: 11px 4px; }
  .conv-btn:last-child:nth-child(even) { grid-column: 1 / -1; }
  .conv-btn[aria-pressed="true"] { background: var(--oh-accent-bg); border-color: var(--oh-accent-bg); color: var(--oh-on-accent); }
  .conv-out { display: grid; gap: 6px; }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 3px; }
  .box {
    display: flex; align-items: baseline; border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px; background: var(--paper);
  }
  .box:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
  .sym { font-weight: 700; color: var(--muted); margin-right: 6px; white-space: nowrap; }
  .box input {
    width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; outline: none;
  }
  .conv-eq { text-align: center; color: var(--muted); font-weight: 700; line-height: 1; }
  .rate { margin: 10px 0 0; font-size: 0.8rem; color: var(--muted); }
  .rate.warn { color: var(--warn); font-weight: 600; }
  @media (max-width: 520px) { .conv { gap: 8px; } .conv-btn { font-size: 0.75rem; padding: 8px 2px; } .box input { font-size: 1.15rem; } .box { padding: 6px 8px; } }

  /* ---------- Sol y aire ---------- */
  .uv-bar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
  .uv-cell { text-align: center; font-variant-numeric: tabular-nums; }
  .uv-val { display: block; border-radius: 6px; padding: 8px 0; font-weight: 800; font-size: 1.05rem; color: #ffffff; }
  .uv-cell.now .uv-val { outline: 2px solid var(--ink); outline-offset: 1px; }
  .uv-hour { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 3px; }
  .uv-cell.now .uv-hour { color: var(--ink); font-weight: 700; }
  .uv0 { background: #3ea72d; } .uv1 { background: #e8c100; color: #1b2233 !important; }
  .uv2 { background: #f18b00; } .uv3 { background: #e53210; } .uv4 { background: #8e4ab1; }
  .uv-note { margin: 8px 0 0; }
  .uv-place + .uv-place { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .uv-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .uv-head strong { font-size: 1rem; }
  .aq { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.85rem; }
  .aq.a0 .dot { background: #3ea72d; } .aq.a1 .dot { background: #e8c100; } .aq.a2 .dot { background: #f18b00; }
  .aq.a3 .dot { background: #e53210; } .aq.a4 .dot { background: #8e4ab1; } .aq.a5 .dot { background: #7e0023; }

  .chip {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }

  /* ---------- Previsión: bloques de temperatura ---------- */
  .tr { display: flex; align-items: baseline; justify-content: center; gap: 5px; border-radius: 8px; padding: 4px 6px; background: var(--paper); font-variant-numeric: tabular-nums; }
  .tr i { font-style: normal; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  .tr b { font-size: 1.15rem; font-weight: 800; line-height: 1.1; }
  .tmax b { color: var(--t-max); }
  .tmin b { color: var(--t-min); }
  .status { font-size: 0.85rem; color: var(--muted); padding: 8px 0; }
  .status.warn { color: var(--warn); }

  /* ---------- Previsión detallada ---------- */
  .days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .day { border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; overflow-wrap: anywhere; }
  .day-name { font-weight: 700; }
  .day-temp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 6px 0; }
  .day-temp .tr { flex-direction: column; align-items: center; gap: 0; padding: 4px 2px; min-width: 0; }
  .day p { margin: 2px 0; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .day p.snow { color: var(--deep-blue); font-weight: 700; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .day p.snow { color: #8fb4ff; } }
  .day-head { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .day-head { flex-wrap: wrap; row-gap: 2px; }
  .day-name { overflow-wrap: normal; white-space: nowrap; }
  .day-ico { width: 28px; height: 28px; flex: none; }
  .day-ico svg { width: 100%; height: 100%; display: block; }
  .details .card:first-child { margin-top: 16px; }

  /* ---------- Tiempo: hoy y hora a hora ---------- */
  .today-main { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .today-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .today-name { font-weight: 800; font-size: 1.25rem; }
  .today-ico { width: 34px; height: 34px; flex: none; }
  .today-ico svg, .h-i svg { width: 100%; height: 100%; display: block; }
  .today-desc { color: var(--muted); font-size: 0.9rem; }
  .today-range { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; min-width: 150px; flex: none; }
  .today-meta { margin: 8px 0 0; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .today-meta strong { color: var(--ink); }
  .stale { color: var(--mid); font-weight: 700; }
  .hours {
    position: relative; display: flex; gap: 4px; overflow-x: auto; margin: 12px 0 0; padding-bottom: 6px;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  }
  .hour { flex: 0 0 50px; text-align: center; border-radius: 10px; background: var(--paper); padding: 6px 2px; font-variant-numeric: tabular-nums; scroll-snap-align: start; }
  .hour.past { opacity: 0.45; }
  .hour.now { background: var(--oh-accent-bg); color: var(--oh-on-accent); }
  .h-t { display: block; font-size: 0.72rem; color: var(--muted); }
  .h-i { display: block; width: 26px; height: 26px; margin: 2px auto; }
  .h-v { display: block; font-weight: 800; }
  .h-r { display: block; font-size: 0.68rem; color: var(--rain); min-height: 1.1em; }
  .hour.now .h-t, .hour.now .h-r { color: inherit; }
  .sub { font-size: 0.95rem; font-weight: 700; margin: 16px 0 8px; }
  @media (max-width: 520px) { .today-range { min-width: 128px; } .today-name { font-size: 1.1rem; } }

  /* ---------- Calendario ---------- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cal-month { font-weight: 800; font-size: 1.1rem; text-align: center; flex: 1; }
  .cal-month button { font: inherit; font-size: 0.75rem; font-weight: 700; margin-left: 8px; vertical-align: 2px; }
  .cal-btn {
    width: 40px; height: 40px; flex: none; border-radius: 10px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .cal-btn svg { width: 18px; height: 18px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; padding: 2px 0 4px; }
  .cal-day {
    min-height: 46px; border: 0; border-radius: 10px; background: var(--paper); color: var(--ink);
    font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0 5px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-variant-numeric: tabular-nums;
  }
  .cal-day.empty { visibility: hidden; }
  .cal-day.sun { color: var(--c-pais); }
  .cal-day.fest-p { background: var(--c-pais); color: #ffffff; }
  .cal-day.fest-u { background: var(--c-usa); color: #ffffff; }
  .cal-day.fest-p.fest-u { background: linear-gradient(135deg, var(--c-pais) 50%, var(--c-usa) 50%); }
  .cal-day.prov-p { box-shadow: inset 0 0 0 2px var(--c-pais); }
  .cal-day.prov-u { box-shadow: inset 0 0 0 2px var(--c-usa); }
  .cal-day.prov-p.prov-u { box-shadow: inset 0 0 0 2px var(--c-usa), inset 0 0 0 4px var(--c-pais); }
  .cal-day.today { box-shadow: inset 0 0 0 2px var(--ink); }
  .cal-day.fest-p.today, .cal-day.fest-u.today { box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 4px #ffffff; }
  .cal-day[aria-pressed="true"] { outline: 3px solid var(--focus); outline-offset: 1px; }
  .cal-dots { display: flex; gap: 3px; height: 6px; }
  .cal-dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
  .d-fam { background: var(--ok); }
  .d-sen { background: var(--oh-gold); }
  .d-evt { background: #3c6fd1; }
  .d-esc { background: #8e4ab1; }
  .tag.Esc { background: #8e4ab1; }
  .cal-warn { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--alert-bg); color: var(--ink); font-size: 0.82rem; border-left: 4px solid var(--warn); }
  .cal-status { margin: 6px 0 0; font-size: 0.72rem; color: var(--muted); }
  .cal-status:empty { display: none; }
  .cal-day.fest-p .d-fam, .cal-day.fest-u .d-fam { background: #ffffff; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; font-size: 0.78rem; color: var(--muted); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .sw.fest-p { background: var(--c-pais); }
  .sw.fest-u { background: var(--c-usa); }
  .sw.prov { box-shadow: inset 0 0 0 2px var(--muted); }
  .sw.dot { border-radius: 50%; width: 8px; height: 8px; }
  .cal-detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .cal-date { font-weight: 800; margin: 0 0 6px; }
  .cal-date::first-letter { text-transform: uppercase; }
  .cal-marks { list-style: none; margin: 0; padding: 0; }
  .cal-marks li { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; }
  .cal-marks .meta { display: block; font-size: 0.78rem; color: var(--muted); }
  .cal-none { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .cal-santo { margin: 8px 0 0; font-size: 0.9rem; }
  .cal-santo b { font-weight: 700; }
  @media (max-width: 520px) { .cal-grid { gap: 3px; } .cal-day { min-height: 40px; font-size: 0.92rem; } }

  /* ---------- Aviso a pantalla completa ---------- */
  .splash {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    background:
      linear-gradient(180deg, var(--oh-gold) 0 8px, var(--oh-black) 8px 12px, transparent 12px),
      linear-gradient(0deg, var(--oh-gold) 0 8px, var(--oh-black) 8px 12px, transparent 12px),
      var(--paper);
    cursor: pointer;
    opacity: 1; transition: opacity 0.6s ease;
  }
  .splash[hidden] { display: none; }
  .splash.closing { opacity: 0; }
  .splash-inner { position: relative; max-width: 640px; text-align: center; animation: splash-in 0.7s ease both; }
  .confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .splash-text {
    margin: 0; font-size: clamp(2rem, 9vw, 3.6rem); font-weight: 800;
    line-height: 1.12; letter-spacing: -0.02em; color: var(--ink);
  }
  .splash-hint { margin: 22px 0 0; font-size: 0.85rem; color: var(--muted); }
  .splash-bar {
    position: absolute; left: 24px; right: 24px; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    height: 4px; border-radius: 2px; background: var(--line); overflow: hidden;
  }
  .splash-bar span { display: block; height: 100%; width: 100%; background: var(--oh-gold); transform-origin: left; }
  @keyframes splash-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .splash, .splash-inner { animation: none; transition: none; }
  }
  body.splash-open { overflow: hidden; }

  /* ---------- Frase del día ---------- */
  .love { margin: 0 0 14px; text-align: center; font-size: 0.8rem; color: var(--muted); font-style: italic; line-height: 1.35; }
  .love-es { display: block; }
  .love-es:empty { display: none; }
  .love.special #love-en { font-style: normal; font-weight: 700; font-size: 0.9rem; color: var(--ink); }
  .love-pre { display: block; font-style: normal; font-weight: 600; color: var(--c-pais); margin-top: 4px; }
  .love-pre:empty { display: none; }

  /* ---------- Expresiones útiles: 2 columnas x 6 ---------- */
  .xlist {
    list-style: none; margin: 0; padding: 0; display: grid;
    grid-template-columns: 1fr 1fr; grid-template-rows: repeat(6, auto); grid-auto-flow: column; gap: 0 14px;
  }
  .xlist li { padding: 5px 0; border-top: 1px solid var(--line); min-width: 0; line-height: 1.25; }
  .xlist li.col-top { border-top: 0; }
  .x-en { display: block; font-weight: 700; font-size: 0.92rem; }
  .x-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .x-head h2 { margin: 0; }
  .chip[aria-pressed="true"] { background: var(--oh-accent-bg); border-color: var(--oh-accent-bg); color: var(--oh-on-accent); }
  .xlist li { position: relative; padding-right: 26px; }
  .x-chk { position: absolute; right: 0; top: 5px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: transparent; font: inherit; font-size: 0.75rem; line-height: 1; cursor: pointer; padding: 0; }
  .xlist li.learned .x-chk { background: var(--ok); border-color: var(--ok); color: #ffffff; }
  .xlist li.learned .x-en { color: var(--muted); text-decoration: line-through; }
  .repaso .x-es { color: transparent; background: var(--paper); border-radius: 4px; cursor: pointer; user-select: none; }
  .repaso .x-es::after { content: var(--toca-ver, "toca para ver"); color: var(--muted); font-size: 0.72rem; position: absolute; left: 0; bottom: 5px; }
  .repaso li:not(.show) .x-es { white-space: nowrap; overflow: hidden; height: 1.15em; }
  .repaso li.show .x-es { color: var(--muted); background: transparent; }
  .repaso li.show .x-es::after { content: none; }
  .repaso li { cursor: pointer; }
  .x-foot { margin: 10px 0 0; }
  .linkbtn { font: inherit; color: var(--focus); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .x-es { display: block; color: var(--muted); font-size: 0.8rem; }
  @media (max-width: 520px) { .xlist { gap: 0 10px; } .x-en { font-size: 0.85rem; } .x-es { font-size: 0.75rem; } }


  /* ---------- Fechas (estilos) ---------- */
  .tag { font-size: 0.75rem; font-weight: 700; border-radius: 6px; padding: 2px 7px; color: #ffffff; min-width: 2.6em; text-align: center; }
  .tag.Fest { background: var(--c-pais); }
  .tag.FestU { background: var(--c-usa); }
  .tag.Dia { background: var(--muted); }
  .tag.Fam { background: var(--ok); }
  .tag.Evt { background: #3c6fd1; }
  .dlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; gap: 0 14px; }
  .dlist li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); min-width: 0; }
  .dlist li.col-top { border-top: 0; }
  .dlist .tag { margin-top: 1px; flex: none; }
  .d-txt { min-width: 0; line-height: 1.25; }
  .d-name { display: block; font-weight: 600; font-size: 0.9rem; overflow-wrap: anywhere; }
  .d-cd { display: block; font-size: 0.75rem; font-variant-numeric: tabular-nums; color: var(--ink); }
  .d-cd.today { color: var(--c-pais); font-weight: 800; }
  .d-when { display: block; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 520px) { .dlist { gap: 0 10px; } .d-name { font-size: 0.82rem; } .dlist .tag { font-size: 0.66rem; padding: 2px 5px; min-width: 0; } }

  footer { margin-top: 24px; text-align: center; font-size: 0.8rem; color: var(--muted); }
  footer button {
    font: inherit; font-weight: 700; color: var(--oh-on-accent); background: var(--oh-accent-bg);
    border: 1px solid var(--oh-accent-bg); border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  @media (max-width: 520px) {
    main { padding: 14px 10px 32px; }
    .clock-date { font-size: 0.8rem; }
    .card { padding: 14px 12px; }
    .flags { gap: 8px; }
    .gap { font-size: 0.75rem; }
    .clock-wx { font-size: 0.78rem; }
    .days { gap: 5px; }
    .day { padding: 6px; }
    .day-name { font-size: 0.85rem; }
    .day-ico { width: 22px; height: 22px; }
    .day p { font-size: 0.74rem; }
    .day-temp .tr i { font-size: 0.62rem; }
    .day-temp .tr b { font-size: 1.05rem; }
  }
</style>
</head>
<body>
<main>
  <!-- 1. Frase del día (o mensaje especial y aviso de próximos cumpleaños) -->
  <p class="love" id="love" hidden><span id="love-en"></span><span class="love-es" id="love-es"></span><span class="love-pre" id="love-pre"></span></p>

  <!-- 2. Banderas: país (izquierda) y EE. UU. (derecha). Debajo, hora, lugar, día y tiempo actual -->
  <section id="hora-local" aria-label="Hora local">
    <div class="flags">
      <div class="flag-block">
        <button type="button" class="flag-btn" id="flag-p-btn" aria-expanded="false" aria-controls="ver-menu" disabled><svg class="flag" id="flag-p" viewBox="0 0 750 500" role="img"></svg></button>
        <div class="clock"><span class="wx-ico" id="ico-p" aria-hidden="true"></span><span id="clock-p">--:--</span></div>
        <div class="clock-place" id="place-p"></div>
        <div class="clock-date" id="date-p"></div>
        <div class="clock-wx" id="wx-p"></div>
      </div>
      <div class="gap" id="gap"></div>
      <div class="flag-block">
        <svg class="flag" id="flag-u" viewBox="0 0 750 500" role="img"></svg>
        <div class="clock"><span class="wx-ico" id="ico-u" aria-hidden="true"></span><span id="clock-u">--:--</span></div>
        <div class="clock-place" id="place-u"></div>
        <div class="clock-date" id="date-u"></div>
        <div class="clock-wx" id="wx-u"></div>
      </div>
    </div>
    <div class="ver-menu" id="ver-menu" hidden></div>
  </section>

  <!-- 3. Tiempo: una tarjeta por lugar, en el orden de "ordenTiempo" en config.js -->
  <div id="details"></div>

  <!-- 4. Calendario -->
  <section class="card" id="cal-card" aria-labelledby="cal-title">
    <h2 id="cal-title">Calendario</h2>
    <div class="cal-nav">
      <button type="button" class="cal-btn" id="cal-prev" aria-label="Mes anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="cal-month"><span id="cal-month" aria-live="polite"></span><button type="button" class="chip" id="cal-today" hidden>Hoy</button></div>
      <button type="button" class="cal-btn" id="cal-next" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <p class="cal-warn" id="cal-warn" hidden></p>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-legend" aria-hidden="true">
      <span><i class="sw fest-p"></i><span id="leg-p">Festivo</span></span>
      <span><i class="sw fest-u"></i><span id="leg-u">Festivo EE. UU.</span></span>
      <span><i class="sw prov"></i><span id="leg-prev">Festivo previsto</span></span>
      <span><i class="sw dot d-fam"></i><span id="leg-fam">Familia</span></span>
      <span><i class="sw dot d-sen"></i><span id="leg-sen">Día señalado</span></span>
      <span><i class="sw dot d-esc"></i><span id="leg-esc">Escolar</span></span>
      <span><i class="sw dot d-evt"></i><span id="leg-evt">Evento</span></span>
    </div>
    <p class="cal-status" id="cal-status"></p>
    <div class="cal-detail" id="cal-detail" aria-live="polite"></div>
  </section>

  <!-- 5. Próximas fechas con cuenta atrás (misma fuente que el calendario) -->
  <section class="card" id="dates-card" aria-labelledby="dates-title">
    <h2 id="dates-title">Próximas fechas</h2>
    <ul class="dlist" id="dates"></ul>
  </section>

  <!-- Conversor: dólares y moneda del país (principal) + unidades -->
  <section class="card" id="conv-card" aria-labelledby="conv-title">
    <h2 id="conv-title">Conversor</h2>
    <div class="conv">
      <div class="conv-btns" id="conv-btns" role="group" aria-label="Qué convertir"></div>
      <div class="conv-out">
        <div class="field">
          <label for="conv-a" id="conv-a-label"></label>
          <div class="box"><span class="sym" id="conv-a-sym"></span><input id="conv-a" inputmode="decimal" autocomplete="off" value="20"></div>
        </div>
        <div class="conv-eq" aria-hidden="true">=</div>
        <div class="field">
          <label for="conv-b" id="conv-b-label"></label>
          <div class="box"><span class="sym" id="conv-b-sym"></span><input id="conv-b" inputmode="decimal" autocomplete="off"></div>
        </div>
      </div>
    </div>
    <p class="rate" id="conv-note"></p>
  </section>

  <!-- Sol y aire: índice UV por hora y calidad del aire, un bloque por lugar del tiempo -->
  <section class="card" id="uv-card" aria-labelledby="uv-title">
    <h2 id="uv-title">Sol y aire</h2>
    <div id="uv-wrap"></div>
  </section>

  <!-- Expresiones útiles -->
  <section class="card" id="expr-card" aria-labelledby="expr-title" hidden>
    <div class="x-head">
      <h2 id="expr-title">Expresiones útiles</h2>
      <button type="button" class="chip" id="expr-mode" aria-pressed="false">Repaso</button>
    </div>
    <ul class="xlist" id="expr-list"></ul>
    <p class="x-foot small muted"><span id="expr-count"></span> <button type="button" class="linkbtn" id="expr-reset" hidden>Reiniciar aprendidas</button></p>
  </section>

  <!-- Avisos meteorológicos oficiales (MeteoAlarm / AEMET) -->
  <section class="card" id="alerts-card" aria-labelledby="alerts-title" hidden>
    <h2 id="alerts-title">Avisos meteorológicos</h2>
    <div id="alerts-body" aria-live="polite"></div>
    <p class="small muted" id="alerts-foot"></p>
  </section>

  <!-- Noticias políticas -->
  <section class="card" id="news-card" aria-labelledby="news-title" hidden>
    <h2 id="news-title">Noticias políticas</h2>
    <div class="news-tabs" id="news-tabs" role="group" aria-label="País"></div>
    <ul class="news-list" id="news-list" aria-live="polite"></ul>
    <p class="small muted" id="news-foot"></p>
  </section>

  <footer>
    <p id="updated"></p>
    <button type="button" id="refresh">Actualizar ahora</button>
  </footer>
</main>

<!-- Aviso a pantalla completa en fechas clave -->
<div class="splash" id="splash" role="alert" hidden>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <div class="splash-inner">
    <p class="splash-text" id="splash-text"></p>
    <p class="splash-hint" id="splash-hint">Toca para cerrar</p>
  </div>
  <div class="splash-bar" aria-hidden="true"><span id="splash-bar"></span></div>
</div>

<script src="config.js"></script>
<script src="cumples.js"></script>

  var AV = CFG.avisos;

     config.js > noticias: { porPais, minutosCache, paises: [{ nombre, fuentes: [{ nombre, rss }] }] }.

  var NEWS = CFG.noticias, newsSel = 0, newsData = {};

    var doc = new DOMParser().parseFromString(xml, "text/xml");

      function g(tag) { var el = it.querySelector(tag); return el ? el.textContent.trim() : ""; }

    { via: "codetabs", go: function (u) {
      return withTimeout("https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u)).then(function (r) { return r.text(); }).then(function (t) {
        var x = newsItemsFromXML(t); if (!x.length) throw new Error("codetabs"); return x; }); } }
  ];
  // Prueba los servicios en orden hasta que uno devuelva titulares
  function fetchFeed(url) {
    var i = 0;
    function next() {
      if (i >= PROXIES.length) return Promise.reject(new Error("sin respuesta"));
      var P3 = PROXIES[i++];
      return P3.go(url).then(function (items) { return { items: items, via: P3.via }; }, next);
    }
    return next();
  }
  function cleanNews(raw) {
    var seen = {};
    return raw.map(function (x) {
      var title = String(x.title || "").replace(/\s+/g, " "), src = String(x.source || "");
      if (x.splitSource) {                                                  // "Titular - Medio" (Google News)
        var m = title.match(/^(.*)\s[-–]\s([^-–]{2,60})$/);
        if (m) { title = m[1]; if (!src) src = m[2]; }
      }
      var ds = String(x.date || ""), iso = /^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(ds);   // rss2json: "AAAA-MM-DD hh:mm:ss" en UTC
      var d = Date.parse(iso ? ds.replace(" ", "T") + "Z" : ds);
      var link = /^https?:\/\//i.test(String(x.link || "").trim()) ? String(x.link).trim() : "";
      return { t: title.trim(), s: src.trim(), l: link, d: isNaN(d) ? 0 : d };
    }).filter(function (x) {
      var k = x.t.toLowerCase();
      if (!x.t || !x.l || seen[k]) return false;
      seen[k] = 1; return true;
    }).sort(function (a, b) { return b.d - a.d; }).slice(0, NEWS.porPais || 8);
  }
  function renderNews() {
    if (!NEWS) return;
    var P2 = NEWS.paises[newsSel], st = newsData[newsSel], ul = $("news-list"), foot = $("news-foot");
    ul.innerHTML = "";
    Array.prototype.forEach.call($("news-tabs").children, function (b, i) { b.setAttribute("aria-pressed", String(i === newsSel)); });
    if (!st) { ul.innerHTML = '<li class="muted">' + T.cargandoNoticias + "</li>"; foot.textContent = ""; return; }
    var diag = (st.diag || []).map(function (f) { return f.nombre + " (" + (f.ok ? f.via : T.sinRespuesta) + ")"; }).join(", ");
    if (!st.items || !st.items.length) { ul.innerHTML = '<li class="status warn">' + T.sinNoticias + "</li>"; foot.textContent = diag ? T.fuentes + diag : ""; return; }
    st.items.forEach(function (x) {
      var li = document.createElement("li"), a = document.createElement("a"), meta = document.createElement("span");
      a.href = x.l; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = x.t;
      meta.className = "news-meta"; meta.textContent = [x.s, x.d ? ago(x.d) : ""].filter(Boolean).join(" · ");
      li.appendChild(a); li.appendChild(meta); ul.appendChild(li);
    });
    foot.textContent = (st.saved ? tx("noticiasGuardadas", ago(st.t)) : tx("noticiasActualizadas", ago(st.t))) + " " +
      (P2.nota || T.noticiasFuente) + (diag ? " " + T.fuentes + diag + "." : "");
  }
  function loadNews(force) {
    if (!NEWS || $("news-card").dataset.off) return;
    NEWS.paises.forEach(function (P2, i) {
      var key = "noticias:" + i, c = load(key);
      if (c && c.items && !newsData[i]) newsData[i] = { items: c.items, t: c.t, saved: true, diag: c.diag };
      if (!force && c && Date.now() - c.t < (NEWS.minutosCache || 30) * 60000) { newsData[i] = { items: c.items, t: c.t, diag: c.diag }; renderNews(); return; }
      var fuentes = P2.fuentes || [{ nombre: "", rss: P2.rss }];
      Promise.all(fuentes.map(function (f) {
        return fetchFeed(f.rss).then(function (r) {
          r.items.forEach(function (x) { if (f.nombre) x.source = f.nombre; else x.splitSource = true; });
          return { nombre: f.nombre || "RSS", ok: true, via: r.via, items: r.items };
        }, function () { return { nombre: f.nombre || "RSS", ok: false, items: [] }; });
      })).then(function (res) {
        var diag = res.map(function (r) { return { nombre: r.nombre, ok: r.ok, via: r.via }; });
        var items = cleanNews([].concat.apply([], res.map(function (r) { return r.items; })));
        if (items.length) {
          store(key, { t: Date.now(), items: items, diag: diag });
          newsData[i] = { items: items, t: Date.now(), diag: diag };
        } else {
          newsData[i] = c && c.items ? { items: c.items, t: c.t, saved: true, diag: diag } : { items: [], diag: diag };
        }
        renderNews();
      });
    });
    renderNews();
  }
  (function () {
    if (!NEWS || !(NEWS.paises || []).length) return;
    if ($("news-card").dataset.off) return;
    $("news-card").hidden = false;
    NEWS.paises.forEach(function (P2, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = P2.nombre;
      b.addEventListener("click", function () { newsSel = i; renderNews(); });
      $("news-tabs").appendChild(b);
    });
    if (NEWS.paises.length === 1) $("news-tabs").hidden = true;
  })();

  /* ---------- Carga y refresco ---------- */
  function loadWeatherAll() {
    loadDetail(); loadUV(); loadRate();
    $("updated").textContent = tx("actualizado", fmtTime(tzMain), cityMain);
  }
  var lastLoad = Date.now();
  function loadAll(force) { lastLoad = Date.now(); loadWeatherAll(); loadNews(force === true); loadAlerts(force === true); renderCalendarToday(); renderDates(); renderLove(); renderExpr(); }
  $("refresh").addEventListener("click", function () { loadAll(true); });
  loadAll();
  showSplash();

  /* ---------- Aviso a pantalla completa en fechas clave ---------- */
  // Confeti con los colores de las dos banderas. No se lanza si el móvil tiene "Reducir movimiento".
  function startConfetti(secs) {
    var canvas = $("confetti");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var ctx = canvas.getContext && canvas.getContext("2d");
    if (reduce || !ctx) return function () {};
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = canvas.clientWidth || window.innerWidth, H = canvas.clientHeight || window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var COLORS = FP.confeti.concat(FU.confeti);
    var pieces = [], N = Math.round(Math.min(160, W * 0.35));
    for (var i = 0; i < N; i++) {
      pieces.push({
        x: Math.random() * W, y: -20 - Math.random() * H * 0.9,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        vx: -0.6 + Math.random() * 1.2, vy: 1.6 + Math.random() * 2.4,
        rot: Math.random() * Math.PI, vr: -0.12 + Math.random() * 0.24,
        sway: Math.random() * Math.PI * 2, color: COLORS[i % COLORS.length]
      });
    }
    var start = performance.now(), last = start, raf, running = true, spawnEnd = secs * 1000 * 0.55;
    function frame(now) {
      if (!running) return;
      var dt = Math.min(2.5, (now - last) / 16.67); last = now;
      ctx.clearRect(0, 0, W, H);
      var alive = 0;
      pieces.forEach(function (p) {
        p.sway += 0.05 * dt;
        p.x += (p.vx + Math.sin(p.sway) * 0.6) * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        if (p.y > H + 20 && now - start < spawnEnd) { p.y = -20; p.x = Math.random() * W; }
        if (p.y <= H + 20) {
          alive++;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.sway * 1.7));
          ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
        }
      });
      if (alive) raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return function () { running = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); };
  }
  function showSplash() {
    var S = CFG.aviso || {};
    if (S.activo === false) return;
    var msg = specialMessage();
    if (!msg) return;
    var withConfetti = messagesFor(0).some(function (x) { return x.confeti; });
    var secs = S.segundos || 5, el = $("splash"), bar = $("splash-bar"), timer;
    $("splash-text").textContent = msg;
    el.hidden = false;
    document.body.classList.add("splash-open");
    bar.style.transition = "none";
    bar.style.transform = "scaleX(1)";
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        bar.style.transition = "transform " + secs + "s linear";
        bar.style.transform = "scaleX(0)";
      });
    });
    var stopConfetti = withConfetti ? startConfetti(secs) : function () {};
    function close() {
      clearTimeout(timer);
      stopConfetti();
      el.classList.add("closing");
      setTimeout(function () { el.hidden = true; el.classList.remove("closing"); document.body.classList.remove("splash-open"); }, 600);
    }
    el.addEventListener("click", close, { once: true });
    timer = setTimeout(close, secs * 1000);
  }
  setInterval(loadWeatherAll, 30 * 60 * 1000);
  setInterval(function () { loadNews(false); loadAlerts(false); }, 15 * 60 * 1000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - lastLoad > 10 * 60 * 1000) loadAll();
  });
})();
</script>
