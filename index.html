<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e10">
<title>Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f4f3;
    --surface: #ffffff;
    --ink: #0e0e10;
    --muted: #5c5c60;
    --line: #e0e0dd;
    /* Colores Ogemaw: dorado, gris y negro */
    --t-max: #c2410c;
    --t-min: #1d5fc4;
    --oh-gold: #f4c446;
    --oh-grey: #4c4c4e;
    --oh-black: #0e0e10;
    --oh-on-accent: #f4c446;     /* texto sobre fondo de acento */
    --oh-accent-bg: #0e0e10;     /* fondo de acento */
    --es-red: #aa151b;
    --es-yellow: #f1bf00;
    --deep-blue: #0a3161;
    --warn: #b31942;
    --ok: #1d7a46;
    --mid: #a76a00;
    --focus: #0a6cff;
    --alert-bg: #fff1f2;
    --cloud: #aab3c5;
    --sun: #f2a900;
    --rain: #2f7de1;
    --snow: #7fa7ff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #161618;
      --surface: #232325;
      --ink: #f2f2f2;
      --muted: #a3a3a8;
      --line: #3a3a3d;
      --oh-on-accent: #0e0e10;
      --oh-accent-bg: #f4c446;
      --t-max: #ff9466;
      --t-min: #7fb2ff;
      --ok: #4cc283;
      --mid: #e0a43a;
      --alert-bg: #3a1a20;
      --cloud: #8590a6;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1rem; font-weight: 600; color: var(--muted); margin: 0 0 14px; text-align: center; }
  h2 { font-size: 1.15rem; font-weight: 700; margin: 0 0 12px; padding-left: 10px; border-left: 4px solid var(--oh-gold); line-height: 1.2; }
  .card {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Reloj ---------- */
  .clock-block { text-align: center; }
  .clock {
    font-size: clamp(2rem, 9vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em;
    line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums;
  }
  .clock { display: flex; justify-content: center; align-items: center; gap: 0.18em; }
  .clock-place { font-weight: 600; margin-top: 4px; }
  .clock-date { color: var(--muted); font-size: 0.9rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  /* ---------- Formularios comunes ---------- */
  .conv-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
  .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  .box {
    display: flex; align-items: baseline; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; background: var(--paper);
  }
  .box:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
  .sym { font-weight: 700; color: var(--muted); margin-right: 6px; white-space: nowrap; }
  input, select {
    width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; outline: none;
  }
  select {
    font-size: 1rem; font-weight: 600; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; background: var(--paper); -webkit-appearance: none; appearance: none;
  }
  select:focus-visible { outline: 2px solid var(--focus); }
  .equals { font-size: 1.4rem; color: var(--muted); padding-top: 20px; }

  .chip {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  /* ---------- Conversor: botones en 2 columnas a la izquierda, resultados a la derecha ---------- */
  .conv { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .conv-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .conv-btn {
    font: inherit; font-size: 0.82rem; font-weight: 700; line-height: 1.15; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 4px; cursor: pointer; min-width: 0; overflow-wrap: anywhere;
  }
  .conv-btn.main { grid-column: 1 / -1; font-size: 0.95rem; padding: 11px 4px; }
  .conv-btn:last-child:nth-child(even) { grid-column: 1 / -1; }
  .conv-btn[aria-pressed="true"] { background: var(--oh-accent-bg); border-color: var(--oh-accent-bg); color: var(--oh-on-accent); }
  .conv-out { display: grid; gap: 6px; }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 3px; }
  .box {
    display: flex; align-items: baseline; border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px; background: var(--paper);
  }
  .box:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
  .sym { font-weight: 700; color: var(--muted); margin-right: 6px; white-space: nowrap; }
  .box input {
    width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; outline: none;
  }
  .conv-eq { text-align: center; color: var(--muted); font-weight: 700; line-height: 1; }
  .rate { margin: 10px 0 0; font-size: 0.8rem; color: var(--muted); }
  .rate.warn { color: var(--warn); font-weight: 600; }
  @media (max-width: 520px) { .conv { gap: 8px; } .conv-btn { font-size: 0.75rem; padding: 8px 2px; } .box input { font-size: 1.15rem; } .box { padding: 6px 8px; } }


  /* ---------- Previsión: bloques de temperatura ---------- */
  .list { list-style: none; margin: 0; padding: 0; }
  .tr { display: flex; align-items: baseline; justify-content: center; gap: 5px; border-radius: 8px; padding: 4px 6px; background: var(--paper); font-variant-numeric: tabular-nums; }
  .tr i { font-style: normal; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  .tr b { font-size: 1.15rem; font-weight: 800; line-height: 1.1; }
  .tmax b { color: var(--t-max); }
  .tmin b { color: var(--t-min); }
  .status { font-size: 0.85rem; color: var(--muted); padding: 8px 0; }
  .status.warn { color: var(--warn); }

  /* ---------- Previsión detallada ---------- */
  .days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .day { border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; overflow-wrap: anywhere; }
  .day-name { font-weight: 700; }
  .day-temp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 6px 0; }
  .day-temp .tr { flex-direction: column; align-items: center; gap: 0; padding: 4px 2px; min-width: 0; }
  .day p { margin: 2px 0; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .day p.snow { color: var(--deep-blue); font-weight: 700; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .day p.snow { color: #8fb4ff; } }
  .day-head { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .day-head { flex-wrap: wrap; row-gap: 2px; }
  .day-name { overflow-wrap: normal; white-space: nowrap; }
  .day-ico { width: 28px; height: 28px; flex: none; }
  .day-ico svg { width: 100%; height: 100%; display: block; }
  .details .card:first-child { margin-top: 16px; }

  /* ---------- Tiempo: hoy y hora a hora ---------- */
  .today-main { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .today-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .today-name { font-weight: 800; font-size: 1.25rem; }
  .today-ico { width: 34px; height: 34px; flex: none; }
  .today-ico svg, .h-i svg { width: 100%; height: 100%; display: block; }
  .today-desc { color: var(--muted); font-size: 0.9rem; }
  .today-range { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; min-width: 150px; flex: none; }
  .today-meta { margin: 8px 0 0; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .today-meta strong { color: var(--ink); }
  .stale { color: var(--mid); font-weight: 700; }
  .hours {
    position: relative; display: flex; gap: 4px; overflow-x: auto; margin: 12px 0 0; padding-bottom: 6px;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  }
  .hour { flex: 0 0 50px; text-align: center; border-radius: 10px; background: var(--paper); padding: 6px 2px; font-variant-numeric: tabular-nums; scroll-snap-align: start; }
  .hour.past { opacity: 0.45; }
  .hour.now { background: var(--oh-accent-bg); color: var(--oh-on-accent); }
  .h-t { display: block; font-size: 0.72rem; color: var(--muted); }
  .h-i { display: block; width: 26px; height: 26px; margin: 2px auto; }
  .h-v { display: block; font-weight: 800; }
  .h-r { display: block; font-size: 0.68rem; color: var(--rain); min-height: 1.1em; }
  .hour.now .h-t, .hour.now .h-r { color: inherit; }
  .sub { font-size: 0.95rem; font-weight: 700; margin: 16px 0 8px; }
  @media (max-width: 520px) { .today-range { min-width: 128px; } .today-name { font-size: 1.1rem; } }

  /* ---------- Calendario ---------- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cal-month { font-weight: 800; font-size: 1.1rem; text-align: center; flex: 1; }
  .cal-month button { font: inherit; font-size: 0.75rem; font-weight: 700; margin-left: 8px; vertical-align: 2px; }
  .cal-btn {
    width: 40px; height: 40px; flex: none; border-radius: 10px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .cal-btn svg { width: 18px; height: 18px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; padding: 2px 0 4px; }
  .cal-day {
    min-height: 46px; border: 0; border-radius: 10px; background: var(--paper); color: var(--ink);
    font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0 5px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-variant-numeric: tabular-nums;
  }
  .cal-day.empty { visibility: hidden; }
  .cal-day.sun { color: var(--es-red); }
  .cal-day.fest { background: var(--es-red); color: #ffffff; }
  .cal-day.fest.prov { background: transparent; color: var(--es-red); box-shadow: inset 0 0 0 2px var(--es-red); }
  .cal-day.today { box-shadow: inset 0 0 0 2px var(--ink); }
  .cal-day.fest.today { box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 4px #ffffff; }
  .cal-day[aria-pressed="true"] { outline: 3px solid var(--focus); outline-offset: 1px; }
  .cal-dots { display: flex; gap: 3px; height: 6px; }
  .cal-dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
  .d-fam { background: var(--ok); }
  .d-sen { background: var(--oh-gold); }
  .d-evt { background: #3c6fd1; }
  .d-esc { background: #8e4ab1; }
  .tag.Esc { background: #8e4ab1; }
  .cal-warn { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--alert-bg); color: var(--ink); font-size: 0.82rem; border-left: 4px solid var(--warn); }
  .cal-status { margin: 6px 0 0; font-size: 0.72rem; color: var(--muted); }
  .cal-status:empty { display: none; }
  .cal-day.fest .d-fam { background: #ffffff; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0 0; font-size: 0.78rem; color: var(--muted); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .sw.fest { background: var(--es-red); }
  .sw.prov { box-shadow: inset 0 0 0 2px var(--es-red); }
  .sw.dot { border-radius: 50%; width: 8px; height: 8px; }
  .cal-detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .cal-date { font-weight: 800; margin: 0 0 6px; }
  .cal-date::first-letter { text-transform: uppercase; }
  .cal-marks { list-style: none; margin: 0; padding: 0; }
  .cal-marks li { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; }
  .cal-marks .meta { display: block; font-size: 0.78rem; color: var(--muted); }
  .cal-none { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .cal-santo { margin: 8px 0 0; font-size: 0.9rem; }
  .cal-santo b { font-weight: 700; }
  @media (max-width: 520px) { .cal-grid { gap: 3px; } .cal-day { min-height: 40px; font-size: 0.92rem; } }

  /* ---------- Aviso a pantalla completa ---------- */
  .splash {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    background:
      linear-gradient(180deg, var(--oh-gold) 0 8px, var(--oh-black) 8px 12px, transparent 12px),
      linear-gradient(0deg, var(--oh-gold) 0 8px, var(--oh-black) 8px 12px, transparent 12px),
      var(--paper);
    cursor: pointer;
    opacity: 1; transition: opacity 0.6s ease;
  }
  .splash[hidden] { display: none; }
  .splash.closing { opacity: 0; }
  .splash-inner { position: relative; max-width: 640px; text-align: center; animation: splash-in 0.7s ease both; }
  .confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .splash-text {
    margin: 0; font-size: clamp(2rem, 9vw, 3.6rem); font-weight: 800;
    line-height: 1.12; letter-spacing: -0.02em; color: var(--ink);
  }
  .splash-hint { margin: 22px 0 0; font-size: 0.85rem; color: var(--muted); }
  .splash-bar {
    position: absolute; left: 24px; right: 24px; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    height: 4px; border-radius: 2px; background: var(--line); overflow: hidden;
  }
  .splash-bar span { display: block; height: 100%; width: 100%; background: var(--oh-gold); transform-origin: left; }
  @keyframes splash-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .splash, .splash-inner { animation: none; transition: none; }
  }
  body.splash-open { overflow: hidden; }

  /* ---------- Frase del día ---------- */
  .love { margin: 0 0 14px; text-align: center; font-size: 0.8rem; color: var(--muted); font-style: italic; line-height: 1.35; }
  .love-es { display: block; }
  .love-es:empty { display: none; }
  .love.special #love-en { font-style: normal; font-weight: 700; font-size: 0.9rem; color: var(--ink); }
  .love-pre { display: block; font-style: normal; font-weight: 600; color: var(--es-red); margin-top: 4px; }
  .love-pre:empty { display: none; }

  /* ---------- Expresiones útiles: 2 columnas x 6 ---------- */
  .xlist {
    list-style: none; margin: 0; padding: 0; display: grid;
    grid-template-columns: 1fr 1fr; grid-template-rows: repeat(6, auto); grid-auto-flow: column; gap: 0 14px;
  }
  .xlist li { padding: 5px 0; border-top: 1px solid var(--line); min-width: 0; line-height: 1.25; }
  .xlist li.col-top { border-top: 0; }
  .x-en { display: block; font-weight: 700; font-size: 0.92rem; }
  .x-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .x-head h2 { margin: 0; }
  .chip[aria-pressed="true"] { background: var(--oh-accent-bg); border-color: var(--oh-accent-bg); color: var(--oh-on-accent); }
  .xlist li { position: relative; padding-right: 26px; }
  .x-chk { position: absolute; right: 0; top: 5px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: transparent; font: inherit; font-size: 0.75rem; line-height: 1; cursor: pointer; padding: 0; }
  .xlist li.learned .x-chk { background: var(--ok); border-color: var(--ok); color: #ffffff; }
  .xlist li.learned .x-en { color: var(--muted); text-decoration: line-through; }
  .repaso .x-es { color: transparent; background: var(--paper); border-radius: 4px; cursor: pointer; user-select: none; }
  .repaso .x-es::after { content: "toca para ver"; color: var(--muted); font-size: 0.72rem; position: absolute; left: 0; bottom: 5px; }
  .repaso li:not(.show) .x-es { white-space: nowrap; overflow: hidden; height: 1.15em; }
  .repaso li.show .x-es { color: var(--muted); background: transparent; }
  .repaso li.show .x-es::after { content: none; }
  .repaso li { cursor: pointer; }
  .x-foot { margin: 10px 0 0; }
  .linkbtn { font: inherit; color: var(--focus); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .x-es { display: block; color: var(--muted); font-size: 0.8rem; }
  @media (max-width: 520px) { .xlist { gap: 0 10px; } .x-en { font-size: 0.85rem; } .x-es { font-size: 0.75rem; } }


  /* ---------- Fechas (estilos) ---------- */
  .list li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; }
  .tag { font-size: 0.75rem; font-weight: 700; border-radius: 6px; padding: 2px 7px; color: #ffffff; min-width: 2.6em; text-align: center; }
  .tag.Fest { background: var(--es-red); }
  .tag.Dia { background: var(--muted); }
  .tag.Fam { background: var(--ok); }
  .tag.Evt { background: var(--deep-blue); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.Evt { background: #3c6fd1; } }
  .dlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; gap: 0 14px; }
  .dlist li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); min-width: 0; }
  .dlist li.col-top { border-top: 0; }
  .dlist .tag { margin-top: 1px; flex: none; }
  .d-txt { min-width: 0; line-height: 1.25; }
  .d-name { display: block; font-weight: 600; font-size: 0.9rem; overflow-wrap: anywhere; }
  .d-cd { display: block; font-size: 0.75rem; font-variant-numeric: tabular-nums; color: var(--ink); }
  .d-cd.today { color: var(--es-red); font-weight: 800; }
  .d-when { display: block; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 520px) { .dlist { gap: 0 10px; } .d-name { font-size: 0.82rem; } .dlist .tag { font-size: 0.66rem; padding: 2px 5px; min-width: 0; } }
  .when { text-align: right; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  footer { margin-top: 24px; text-align: center; font-size: 0.8rem; color: var(--muted); }
  footer button {
    font: inherit; font-weight: 700; color: var(--oh-on-accent); background: var(--oh-accent-bg);
    border: 1px solid var(--oh-accent-bg); border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  @media (max-width: 520px) {
    main { padding: 14px 10px 32px; }
    .clock-date { font-size: 0.8rem; }
    .card { padding: 14px 12px; }
    .conv-row { grid-template-columns: 1fr; }
    .equals { display: none; }
    .days { gap: 5px; }
    .day { padding: 6px; }
    .day-name { font-size: 0.85rem; }
    .day-ico { width: 22px; height: 22px; }
    .day p { font-size: 0.74rem; }
    .day-temp .tr i { font-size: 0.62rem; }
    .day-temp .tr b { font-size: 1.05rem; }
  }
</style>
</head>
<body>
<main>
  <!-- Frase cariñosa del día -->
  <p class="love" id="love" hidden><span id="love-en"></span><span class="love-es" id="love-es"></span><span class="love-pre" id="love-pre"></span></p>

  <!-- Hora -->
  <section class="clock-block" aria-label="Hora local">
    <div class="clock"><span id="clock-es">--:--</span></div>
    <div class="clock-place" id="place-es"></div>
    <div class="clock-date" id="date-es"></div>
  </section>

  <!-- Tiempo: una tarjeta por cada lugar de "detalles" en config.js -->
  <div id="details"></div>

  <!-- Calendario -->
  <section class="card" id="cal-card" aria-labelledby="cal-title">
    <h2 id="cal-title">Calendario</h2>
    <div class="cal-nav">
      <button type="button" class="cal-btn" id="cal-prev" aria-label="Mes anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="cal-month"><span id="cal-month" aria-live="polite"></span><button type="button" class="chip" id="cal-today" hidden>Hoy</button></div>
      <button type="button" class="cal-btn" id="cal-next" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <p class="cal-warn" id="cal-warn" hidden></p>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-legend" aria-hidden="true">
      <span><i class="sw fest"></i>Festivo</span>
      <span><i class="sw prov"></i>Festivo previsto</span>
      <span><i class="sw dot d-fam"></i>Familia</span>
      <span><i class="sw dot d-sen"></i>Día señalado</span>
      <span><i class="sw dot d-esc"></i>Escolar</span>
      <span><i class="sw dot d-evt"></i>Evento</span>
    </div>
    <p class="cal-status" id="cal-status"></p>
    <div class="cal-detail" id="cal-detail" aria-live="polite"></div>
  </section>

  <!-- Fechas -->
  <section class="card" aria-labelledby="dates-title">
    <h2 id="dates-title">Próximas fechas</h2>
    <ul class="dlist" id="dates"></ul>
  </section>

  <!-- Expresiones útiles de la época del año -->
  <section class="card" id="expr-card" aria-labelledby="expr-title" hidden>
    <div class="x-head">
      <h2 id="expr-title">Expresiones útiles</h2>
      <button type="button" class="chip" id="expr-mode" aria-pressed="false">Repaso</button>
    </div>
    <ul class="xlist" id="expr-list"></ul>
    <p class="x-foot small muted"><span id="expr-count"></span> <button type="button" class="linkbtn" id="expr-reset" hidden>Reiniciar aprendidas</button></p>
  </section>

  <!-- Conversor: dólares y euros (principal) + medidas de EE. UU. -->
  <section class="card" id="conv-card" aria-labelledby="conv-title">
    <h2 id="conv-title">Conversor</h2>
    <div class="conv">
      <div class="conv-btns" id="conv-btns" role="group" aria-label="Qué convertir"></div>
      <div class="conv-out">
        <div class="field">
          <label for="conv-a" id="conv-a-label"></label>
          <div class="box"><span class="sym" id="conv-a-sym"></span><input id="conv-a" inputmode="decimal" autocomplete="off" value="20"></div>
        </div>
        <div class="conv-eq" aria-hidden="true">=</div>
        <div class="field">
          <label for="conv-b" id="conv-b-label"></label>
          <div class="box"><span class="sym" id="conv-b-sym"></span><input id="conv-b" inputmode="decimal" autocomplete="off"></div>
        </div>
      </div>
    </div>
    <p class="rate" id="conv-note"></p>
  </section>

  <footer>
    <p id="updated"></p>
    <button type="button" id="refresh">Actualizar ahora</button>
  </footer>
</main>

<!-- Aviso a pantalla completa en fechas clave -->
<div class="splash" id="splash" role="alert" hidden>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <div class="splash-inner">
    <p class="splash-text" id="splash-text"></p>
    <p class="splash-hint">Toca para cerrar</p>
  </div>
  <div class="splash-bar" aria-hidden="true"><span id="splash-bar"></span></div>
</div>

<script src="config.js"></script>
<script src="cumples.js"></script>
<script src="palabras.js"></script>
<script src="santoral.js"></script>
<script>

(function () {
  "use strict";

  var CFG = window.CONFIG;
  // Cumpleaños de cumples.js: se convierten en mensajes especiales (calendario, próximas fechas, cuenta atrás, aviso y confeti)
  CFG.mensajesEspeciales = (CFG.mensajesEspeciales || []).concat((window.CUMPLES || []).filter(function (c) {
    return c && /^\d\d-\d\d$/.test(c[0]) && c[1];
  }).map(function (c) {
    var o = c[2] || {};
    return { fecha: c[0], texto: o.texto || "¡Felicita a " + c[1] + "!", lista: "Cumpleaños de " + c[1],
             avisar: o.avisar !== false, confeti: o.confeti !== false };
  }));
  if (!CFG) {
    document.body.insertAdjacentHTML("afterbegin",
      "<p style='padding:16px'>No se ha podido leer config.js. Revisa comas y comillas en ese archivo.</p>");
    return;
  }
  function $(id) { return document.getElementById(id); }

  document.title = CFG.titulo || "Inicio";

  /* ---------- Almacenamiento en el navegador (caché y preferencias) ---------- */
  var STORE = "inicio:v1:";
  function store(key, val) { try { localStorage.setItem(STORE + key, JSON.stringify(val)); } catch (e) {} }
  function load(key) { try { var v = localStorage.getItem(STORE + key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function ago(t) {
    var m = Math.round((Date.now() - t) / 60000);
    return m < 60 ? "hace " + Math.max(1, m) + " min" : m < 2880 ? "hace " + Math.round(m / 60) + " h" : "hace " + Math.round(m / 1440) + " días";
  }

  /* ---------- Formatos ---------- */
  var nf2 = new Intl.NumberFormat("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var nfMax2 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 2 });
  var nf1 = new Intl.NumberFormat("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  function parseNum(s) {
    s = String(s).replace(/\s/g, "");
    if (s === "") return NaN;
    if (s.indexOf(",") !== -1) s = s.replace(/\./g, "").replace(",", ".");
    return parseFloat(s);
  }
  function selectOnFocus(el) { el.addEventListener("focus", function () { el.select(); }); }

  /* ---------- Reloj ---------- */
  var tzES = CFG.espana.zonaHoraria;
  $("place-es").textContent = CFG.espana.ciudadReloj;

  function fmtTime(tz, d) {
    return new Intl.DateTimeFormat("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: tz }).format(d || new Date());
  }
  function fmtDate(tz) {
    return new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "short", timeZone: tz }).format(new Date());
  }
  function tickClocks() {
    $("clock-es").textContent = fmtTime(tzES);
    $("date-es").textContent = fmtDate(tzES);
  }
  tickClocks();
  setInterval(tickClocks, 15000);

  setInterval(function () { if (typeof renderLove === "function") renderLove(); }, 15 * 60 * 1000);

  /* ---------- Conversor: botones (mismo formato que la versión de EE. UU.) ----------
     Dólares / euros es el principal; el resto son medidas de EE. UU. */
  function lin(f) { return { toB: function (x) { return x * f; }, toA: function (x) { return x / f; } }; }
  var nf4 = new Intl.NumberFormat("es-ES", { minimumFractionDigits: 4, maximumFractionDigits: 4 });
  var MON = CFG.moneda || { codigo: "EUR", simbolo: "€", nombre: "Euros", tasaRespaldo: 0.87 };
  var rate = null, rateTxt = "Cargando tipo de cambio…", rateWarn = false;     // euros por 1 dólar
  var CONV = [
    { id: "money", btn: "Dólares / " + MON.nombre.toLowerCase(), main: true, a: "Dólares", sa: "$", b: MON.nombre, sb: MON.simbolo, money: true,
      conv: { toB: function (x) { return rate ? x * rate : NaN; }, toA: function (x) { return rate ? x / rate : NaN; } } },
    { id: "mi", btn: "Millas / km", a: "Millas", sa: "mi", b: "Kilómetros", sb: "km", conv: lin(1.609344) },
    { id: "yd", btn: "Yardas / m", a: "Yardas", sa: "yd", b: "Metros", sb: "m", conv: lin(0.9144) },
    { id: "f", btn: "°F / °C", a: "Fahrenheit", sa: "°F", b: "Celsius", sb: "°C",
      conv: { toB: function (x) { return (x - 32) * 5 / 9; }, toA: function (x) { return x * 9 / 5 + 32; } } },
    { id: "lb", btn: "Libras / kilos", a: "Libras", sa: "lb", b: "Kilos", sb: "kg", conv: lin(0.45359237) },
    { id: "oz", btn: "Onzas / gramos", a: "Onzas", sa: "oz", b: "Gramos", sb: "g", conv: lin(28.349523125),
      note: "Onza de peso. La onza líquida (fl oz) tiene su propio botón." },
    { id: "cup", btn: "Tazas / ml", a: "Tazas", sa: "cup", b: "Mililitros", sb: "ml", conv: lin(236.5882365),
      note: "Taza de cocina de EE. UU. En las etiquetas nutricionales se redondea a 240 ml." },
    { id: "in", btn: "Pulgadas / cm", a: "Pulgadas", sa: "in", b: "Centímetros", sb: "cm", conv: lin(2.54) },
    { id: "gal", btn: "Galones / litros", a: "Galones", sa: "gal", b: "Litros", sb: "l", conv: lin(3.785411784),
      note: "Galón de EE. UU. (gasolina, leche). El galón británico son 4,55 litros." },
    { id: "mph", btn: "mph / km/h", a: "Millas por hora", sa: "mph", b: "Km por hora", sb: "km/h", conv: lin(1.609344) },
    // Solo en esta versión (ya estaban en el desplegable anterior)
    { id: "floz", btn: "Onzas líquidas / ml", a: "Onzas líquidas", sa: "fl oz", b: "Mililitros", sb: "ml", conv: lin(29.5735295625) },
    { id: "tbsp", btn: "Cucharadas / ml", a: "Cucharadas", sa: "tbsp", b: "Mililitros", sb: "ml", conv: lin(14.78676478125) },
    { id: "ft", btn: "Pies / m", a: "Pies", sa: "ft", b: "Metros", sb: "m", conv: lin(0.3048) }
  ];
  var convCur = CONV[0], convA = $("conv-a"), convB = $("conv-b");
  CONV.forEach(function (u) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "conv-btn" + (u.main ? " main" : ""); b.textContent = u.btn; b.dataset.id = u.id;
    b.setAttribute("aria-pressed", String(u === convCur));
    $("conv-btns").appendChild(b);
  });
  $("conv-btns").addEventListener("click", function (e) {
    var b = e.target.closest(".conv-btn");
    if (!b) return;
    var u = CONV.filter(function (x) { return x.id === b.dataset.id; })[0];
    if (u === convCur) return;
    convCur = u;
    Array.prototype.forEach.call(this.children, function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    convA.value = u.money ? "20" : "1";
    setConv("a");
  });
  function setConv(from) {
    var u = convCur, fmt = u.money ? nf2 : nfMax2;
    $("conv-a-label").textContent = u.a; $("conv-a-sym").textContent = u.sa;
    $("conv-b-label").textContent = u.b; $("conv-b-sym").textContent = u.sb;
    if (from === "a") { var r = u.conv.toB(parseNum(convA.value)); convB.value = isNaN(r) ? "" : fmt.format(r); }
    else { var r2 = u.conv.toA(parseNum(convB.value)); convA.value = isNaN(r2) ? "" : fmt.format(r2); }
    var note = $("conv-note");
    note.className = "rate" + (u.money && rateWarn ? " warn" : "");
    note.textContent = u.money ? rateTxt : (u.note || "");
  }
  convA.addEventListener("input", function () { setConv("a"); });
  convB.addEventListener("input", function () { setConv("b"); });
  selectOnFocus(convA); selectOnFocus(convB);

  // Tipo de cambio: BCE (Frankfurter) > ExchangeRate-API > última tasa guardada > tasa manual
  function showRate(r, txt, warn) {
    rate = r; rateWarn = !!warn;
    rateTxt = "1 $ = " + nf4.format(r) + " " + MON.simbolo + " · 1 " + MON.simbolo + " = " + nf4.format(1 / r) + " $ · " + txt;
    setConv("a");
  }
  function loadRate() {
    var to = MON.codigo;
    fetchJSON("https://api.frankfurter.app/latest?from=USD&to=" + to)
      .then(function (d) { return { r: d.rates[to], src: "tipo de referencia del BCE", fecha: String(d.date || "").split("-").reverse().join("/") }; })
      .catch(function () {
        return fetchJSON("https://open.er-api.com/v6/latest/USD")
          .then(function (d) { return { r: d.rates[to], src: "ExchangeRate-API", fecha: (d.time_last_update_utc || "").slice(5, 16) }; });
      })
      .then(function (x) {
        if (!(x.r > 0)) throw new Error("sin tasa");
        store("cambio:" + to, { t: Date.now(), r: x.r });
        showRate(x.r, x.src + (x.fecha ? " (" + x.fecha + ")" : ""), false);
      })
      .catch(function () {
        var c = load("cambio:" + to);
        if (c && c.r) showRate(c.r, "sin conexión: tasa guardada " + ago(c.t), Date.now() - c.t > 3 * 86400000);
        else if (MON.tasaRespaldo) showRate(MON.tasaRespaldo, "sin conexión: tasa manual de config.js, revísala", true);
        else { rate = null; rateWarn = true; rateTxt = "Sin tipo de cambio: no hay conexión."; setConv("a"); }
      });
  }
  setConv("a");
  loadRate();
  setInterval(loadRate, 30 * 60 * 1000);

  /* ---------- Tiempo (Open-Meteo) ---------- */
  var WMO = {
    0: "Despejado", 1: "Casi despejado", 2: "Parcialmente nuboso", 3: "Cubierto",
    45: "Niebla", 48: "Niebla con escarcha",
    51: "Llovizna débil", 53: "Llovizna", 55: "Llovizna intensa", 56: "Llovizna helada", 57: "Llovizna helada intensa",
    61: "Lluvia débil", 63: "Lluvia", 65: "Lluvia intensa", 66: "Lluvia helada", 67: "Lluvia helada intensa",
    71: "Nieve débil", 73: "Nieve", 75: "Nieve intensa", 77: "Granos de nieve",
    80: "Chubascos débiles", 81: "Chubascos", 82: "Chubascos fuertes", 85: "Chubascos de nieve", 86: "Chubascos de nieve fuertes",
    95: "Tormenta", 96: "Tormenta con granizo", 99: "Tormenta con granizo fuerte"
  };
  /* Iconos del tiempo (SVG propio, sin dependencias) */
  var CLOUD = '<path d="M9 25h15a6 6 0 0 0 0-12a8 8 0 0 0-15 2a5 5 0 0 0 0 10z" fill="var(--cloud)"/>';
  var CLOUD_UP = '<g transform="translate(0,-5)">' + CLOUD + "</g>";
  function sunSvg(cx, cy, r) {
    var rays = "";
    for (var k = 0; k < 8; k++) {
      var a = k * Math.PI / 4, x1 = cx + Math.cos(a) * (r + 2.5), y1 = cy + Math.sin(a) * (r + 2.5),
          x2 = cx + Math.cos(a) * (r + 5.5), y2 = cy + Math.sin(a) * (r + 5.5);
      rays += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '"/>';
    }
    return '<g stroke="var(--sun)" stroke-width="2" stroke-linecap="round">' + rays + "</g>" +
           '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="var(--sun)"/>';
  }
  function moonSvg(cx, cy, s) {
    return '<path transform="translate(' + cx + "," + cy + ") scale(" + s + ')" d="M2-9a10 10 0 1 0 8 15A8 8 0 0 1 2-9z" fill="#c4cbe0"/>';
  }
  function icon(code, isDay) {
    var day = isDay !== 0, b = "";
    if (code === 0 || code === 1) b = day ? sunSvg(16, 16, 6.5) : moonSvg(16, 16, 1.2);
    else if (code === 2) b = (day ? sunSvg(12, 11, 5) : moonSvg(12, 11, 0.8)) + CLOUD;
    else if (code === 3) b = CLOUD;
    else if (code === 45 || code === 48)
      b = '<g stroke="var(--cloud)" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="11" x2="26" y2="11"/><line x1="4" y1="17" x2="28" y2="17"/><line x1="7" y1="23" x2="25" y2="23"/></g>';
    else if ((code >= 71 && code <= 77) || code === 85 || code === 86)
      b = CLOUD_UP + '<g fill="var(--snow)"><circle cx="10" cy="26" r="2"/><circle cx="16" cy="29" r="2"/><circle cx="22" cy="26" r="2"/></g>';
    else if (code >= 95)
      b = CLOUD_UP + '<path d="M17 19l-5 7h4l-2 6 7-9h-4l2-4z" fill="var(--sun)"/>';
    else if (code >= 51)
      b = CLOUD_UP + '<g stroke="var(--rain)" stroke-width="2" stroke-linecap="round"><line x1="11" y1="23" x2="9" y2="28"/><line x1="17" y1="23" x2="15" y2="28"/><line x1="23" y1="23" x2="21" y2="28"/></g>';
    else b = CLOUD;
    return '<svg viewBox="0 0 32 32" aria-hidden="true">' + b + "</svg>";
  }

  function toF(c) { return c * 9 / 5 + 32; }
  function t(c, unit) { return c == null ? "—" : Math.round(unit === "fahrenheit" ? toF(c) : c) + "°"; }
  // Máxima y mínima en dos bloques: etiqueta pequeña y número grande, en color cálido y frío
  function rangeHTML(max, min, unit) {
    return '<span class="tr tmax"><i>Máx</i><b>' + t(max, unit) + "</b></span>" +
           '<span class="tr tmin"><i>Mín</i><b>' + t(min, unit) + "</b></span>";
  }
  function otherUnit(u) { return u === "fahrenheit" ? "celsius" : "fahrenheit"; }
  function unitLetter(u) { return u === "fahrenheit" ? "F" : "C"; }

  function fetchJSON(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  /* ---------- Previsión detallada ---------- */
  function hhmm(iso) { return iso ? iso.slice(11, 16) : "—"; }
  function minutesOf(iso) { var p = iso.slice(11, 16).split(":"); return +p[0] * 60 + +p[1]; }
  function dayLabel(dateStr, i) {
    if (i === 0) return "Hoy";
    if (i === 1) return "Mañana";
    var p = dateStr.split("-");
    var s = new Intl.DateTimeFormat("es-ES", { weekday: "long", timeZone: "UTC" }).format(new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])));
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function buildDetailCards() {
    var wrap = $("details");
    wrap.className = "details";
    wrap.innerHTML = "";
    (CFG.detalles || []).forEach(function (D, n) {
      var sec = document.createElement("section");
      sec.className = "card";
      sec.innerHTML = '<h2 id="detail-title-' + n + '"></h2>' +
        '<div id="today-' + n + '"><p class="status">Cargando el tiempo…</p></div>' +
        '<div class="hours" id="hours-' + n + '" aria-label="Hoy hora a hora"></div>' +
        '<h3 class="sub">Próximos días</h3>' +
        '<div class="days" id="days-' + n + '"></div>';
      wrap.appendChild(sec);
      $("detail-title-" + n).textContent = "Tiempo en " + D.nombre;
    });
  }
  buildDetailCards();

  // Pinta la previsión. Si los datos son de una copia guardada, empieza en el día de hoy dentro de esa copia.
  function renderWeather(D, n, d, savedAt) {
    var unit = D.unidad || "celsius", other = otherUnit(unit), both = D.mostrarAmbasUnidades;
    var dl = d.daily, cur = d.current, hr = d.hourly, td = todayYMD(), todayStr = keyOf(td[0], td[1], td[2]);
    var i0 = dl.time.indexOf(todayStr);
    if (i0 < 0) return false;                      // la copia es demasiado antigua para hoy
    var light = minutesOf(dl.sunset[i0]) - minutesOf(dl.sunrise[i0]), rain0 = dl.precipitation_probability_max[i0];
    var nowTxt = savedAt
      ? '<span class="stale">Sin conexión: previsión guardada ' + ago(savedAt) + "</span>"
      : "Ahora <strong>" + t(cur.temperature_2m, unit) + "</strong>" +
        (both ? " (" + t(cur.temperature_2m, other) + unitLetter(other) + ")" : "") + " · sensación " + t(cur.apparent_temperature, unit);
    $("today-" + n).innerHTML =
      '<div class="today-main"><div class="today-left"><span class="today-name">Hoy</span>' +
      '<span class="today-ico">' + icon(dl.weather_code[i0], 1) + '</span>' +
      '<span class="today-desc">' + (WMO[dl.weather_code[i0]] || "—") + '</span></div>' +
      '<div class="today-range">' + rangeHTML(dl.temperature_2m_max[i0], dl.temperature_2m_min[i0], unit) + '</div></div>' +
      '<p class="today-meta">' + nowTxt +
      ' · lluvia ' + (rain0 == null ? "—" : rain0 + " %") +
      ' · amanece ' + hhmm(dl.sunrise[i0]) + ' · anochece ' + hhmm(dl.sunset[i0]) +
      ' · ' + Math.floor(light / 60) + ' h ' + (light % 60) + ' min de luz</p>';

    // Hoy hora a hora (00 a 23)
    var nowH = +localParts(D.zonaHoraria).hour, html = "";
    hr.time.forEach(function (tm, i) {
      if (tm.slice(0, 10) !== todayStr) return;
      var h = +tm.slice(11, 13), p = hr.precipitation_probability[i];
      html += '<div class="hour' + (h < nowH ? " past" : h === nowH ? " now" : "") + '">' +
        '<span class="h-t">' + (h === nowH ? "Ahora" : String(h).padStart(2, "0") + " h") + '</span>' +
        '<span class="h-i">' + icon(hr.weather_code[i], hr.is_day[i]) + '</span>' +
        '<span class="h-v">' + t(hr.temperature_2m[i], unit) + '</span>' +
        '<span class="h-r">' + (p ? p + " %" : "") + '</span></div>';
    });
    var box = $("hours-" + n);
    box.innerHTML = html;
    var nowEl = box.querySelector(".hour.now");
    box.scrollLeft = nowEl ? Math.max(0, nowEl.offsetLeft - 4) : 0;

    // Días siguientes: desde mañana
    html = "";
    var dias = Math.max(1, Math.min(15, D.dias || 6));

    if (st.fest) info.push(st.fest.ok ? "Festivos " + st.fest.y + " desde fuente online" : "Sin conexión con la fuente de festivos " + st.fest.y);
    var w = $("cal-warn"), s = $("cal-status");
    w.hidden = !warn.length; w.textContent = warn.join(" ");
    s.textContent = info.join(" · ");
  }

  function goMonth(y, m, sel) {
    calY = y; calM = m;
    var td = todayYMD();
    calSel = sel || (y === td[0] && m === td[1] ? td[2] : 1);
    renderCalendar();
  }
  function stepMonth(k) { var x = new Date(Date.UTC(calY, calM - 1 + k, 1)); goMonth(x.getUTCFullYear(), x.getUTCMonth() + 1); }
  $("cal-prev").addEventListener("click", function () { stepMonth(-1); });
  $("cal-next").addEventListener("click", function () { stepMonth(1); });
  $("cal-today").addEventListener("click", function () { var td = todayYMD(); goMonth(td[0], td[1]); });
  $("cal-grid").addEventListener("click", function (e) {
    var b = e.target.closest(".cal-day");
    if (!b || !b.dataset.d) return;
    calSel = +b.dataset.d;
    Array.prototype.forEach.call(this.querySelectorAll(".cal-day[aria-pressed]"), function (x) {
      x.setAttribute("aria-pressed", String(+x.dataset.d === calSel));
    });
    renderCalDetail();
  });
  // Primero se carga la copia guardada de partidos (si la hay), luego se pinta y, si toca, se actualiza online
  function renderCalendarToday() { var td = todayYMD(); loadOnlineSports(); marksCache = {}; goMonth(td[0], td[1]); renderCalStatus(); }

  /* ---------- Próximas fechas (misma fuente que el calendario) ---------- */
  // Próximas fechas con cuenta atrás: todo lo de los próximos "proximasFechasDias" días
  // y, si son menos de "mostrarFechas", se completa con las siguientes.
  var datesDay = "";
  function renderDates() {
    var td = todayYMD(), items = [], min = CFG.mostrarFechas || 12, dias = CFG.proximasFechasDias || 31,
        excl = CFG.proximasFechasExcluir || [];
    datesDay = keyOf(td[0], td[1], td[2]);
    for (var k = 0; k < 400; k++) {
      if (k > dias && items.length >= min) break;
      var r = shiftDays(td[0], td[1], td[2], k);
      marksOn(r[0], r[1], r[2]).forEach(function (m) {
        if ((m.tipo === "evt" || m.tipo === "esc") && !m.inicio && k > 0) return;      // un rango aparece una vez
        if (m.tipo === "evt" && excl.indexOf(m.categoria) !== -1) return;              // fútbol y UFC solo en el calendario
        items.push({ r: r, k: k, m: m });
      });
    }
    var ul = $("dates"), rows = Math.ceil(items.length / 2);
    ul.innerHTML = "";
    ul.style.gridTemplateRows = "repeat(" + Math.max(rows, 1) + ", auto)";
    if (!items.length) { ul.innerHTML = '<li class="col-top"><span class="muted">No hay fechas próximas.</span></li>'; return; }
    var dfmt = new Intl.DateTimeFormat("es-ES", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
    items.forEach(function (x, i) {
      var li = document.createElement("li"), tag = tagOf(x.m);
      if (i === 0 || i === rows) li.className = "col-top";
      li.innerHTML = '<span class="tag ' + tag + '">' + tagText(tag) + '</span><span class="d-txt"><span class="d-name"></span>' +
        '<span class="d-when"></span><span class="d-cd"></span></span>';
      li.querySelector(".d-name").textContent = x.m.nombre + (x.m.provisional ? " (por confirmar)" : "");
      li.querySelector(".d-when").textContent = dfmt.format(new Date(Date.UTC(x.r[0], x.r[1] - 1, x.r[2])));
      var cd = li.querySelector(".d-cd");
      if (x.k === 0) { cd.textContent = x.m.desde && !x.m.inicio ? "En curso" : "¡Es hoy!"; cd.classList.add("today"); }
      else cd.dataset.t = midnightIn(tzES, x.r[0], x.r[1], x.r[2]);
      ul.appendChild(li);
    });
    tickDates();
  }
  // Cuenta atrás en vivo: "4 días · 13:11:04" o "2 meses 3 días · 13:11:04"
  function tickDates() {
    var now = Date.now(), td = todayYMD();
    if (keyOf(td[0], td[1], td[2]) !== datesDay) { renderDates(); return; }   // ha cambiado el día
    Array.prototype.forEach.call(document.querySelectorAll("#dates .d-cd[data-t]"), function (el) {
      var t = +el.dataset.t;
      if (t <= now) { renderDates(); return; }
      var b = breakdown(now, t), d = b[1] * 7 + b[2], txt = "";
      if (b[0]) txt = b[0] + (b[0] === 1 ? " mes " : " meses ");
      if (d || !b[0]) txt += d + (d === 1 ? " día" : " días");
      el.textContent = txt.trim() + " · " + [b[3], b[4], b[5]].map(function (v) { return String(v).padStart(2, "0"); }).join(":");
    });
  }
  setInterval(tickDates, 1000);

  /* ---------- Utilidades de hora local ---------- */
  function localParts(tz, d) {
    var p = {};
    new Intl.DateTimeFormat("en-US", {
      timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit"
    }).formatToParts(d || new Date()).forEach(function (x) { p[x.type] = x.value; });
    return p;
  }
  function localHourISO(tz, d) { var p = localParts(tz, d); return p.year + "-" + p.month + "-" + p.day + "T" + p.hour + ":00"; }

  /* ---------- Rotación diaria ---------- */
  var FRASES = window.FRASES || [];
  function pick(list, i) { return list[((i % list.length) + list.length) % list.length]; }
  function dayNumber() {
    var p = localParts(tzES);
    return Math.floor(Date.UTC(+p.year, +p.month - 1, +p.day) / 86400000);   // cambia a medianoche de Madrid
  }
  // Mensajes especiales: "MM-DD" (cada año), "AAAA-MM-DD" (un día concreto)
  // o regla de festivo móvil { mes, diaSemana (0 domingo ... 6 sábado), orden (1-5, o -1 = último) }.
  // Todas las fechas se evalúan en hora de Madrid.
  function ymdIn(tz, offsetDays) {
    var d = new Date(Date.now() + (offsetDays || 0) * 86400000), p = localParts(tz, d);
    return { y: +p.year, m: +p.month, d: +p.day, mmdd: p.month + "-" + p.day, full: p.year + "-" + p.month + "-" + p.day };
  }
  function matches(x, t) {
    if (x.fecha) { var f = x.fecha.replace(/\s/g, ""); return f === t.mmdd || f === t.full; }
    if (x.regla) {
      var r = x.regla, wd = new Date(Date.UTC(t.y, t.m - 1, t.d)).getUTCDay();
      var dim = new Date(Date.UTC(t.y, t.m, 0)).getUTCDate();
      if (r.mes !== t.m || r.diaSemana !== wd) return false;
      return r.orden === -1 ? t.d + 7 > dim : Math.ceil(t.d / 7) === r.orden;
    }
    return false;
  }
  function messagesFor(offsetDays) {
    return (CFG.mensajesEspeciales || []).filter(function (x) {
      return matches(x, ymdIn(tzES, offsetDays));
    });
  }
  function specialMessage() {
    var hit = messagesFor(0);
    return hit.length ? hit.map(function (x) { return x.texto; }).join("  ·  ") : null;
  }
  // Aviso previo: cumpleaños y fechas marcadas con "lista" en los próximos N días
  function preNotice() {
    var N = CFG.avisoPrevioDias || 0, out = [];
    for (var k = 1; k <= N; k++) {
      messagesFor(k).forEach(function (x) {
        if (!x.lista || !x.avisar) return;
        // evita repetir si ese mensaje ya está activo hoy
        if (messagesFor(0).indexOf(x) !== -1) return;
        if (out.some(function (o) { return o.x === x; })) return;
        out.push({ x: x, k: k });
      });
    }
    return out.map(function (o) { return (o.k === 1 ? "Mañana" : "En " + o.k + " días") + ": " + o.x.lista.charAt(0).toLowerCase() + o.x.lista.slice(1); }).join("  ·  ");
  }

  function renderLove() {
    var special = specialMessage(), pre = preNotice();
    $("love-pre").textContent = pre ? "Recuerda. " + pre : "";
    if (special) {
      $("love").className = "love special";
      $("love-en").textContent = special;
      $("love-es").textContent = "";
      $("love").hidden = false;
      return;
    }
    $("love").className = "love";
    if (!FRASES.length) { $("love-en").textContent = ""; $("love-es").textContent = ""; $("love").hidden = !pre; return; }
    var f = pick(FRASES, dayNumber());
    $("love-en").textContent = f.en;
    $("love-es").textContent = f.es;
    $("love").hidden = false;
  }

  /* ---------- Expresiones útiles de la época del año ---------- */
  // Elige n expresiones seguidas que cambian cada día a medianoche de Madrid (al acabar la lista, vuelve a empezar)
  function dailySlice(list, n) {
    if (list.length <= n) return list.slice();
    var start = (dayNumber() * n) % list.length, out = [];
    for (var i = 0; i < n; i++) out.push(list[(start + i) % list.length]);
    return out;
  }
  function renderExpr() {
    var E = window.EXPRESIONES, card = $("expr-card");
    if (!E) { card.hidden = true; return; }
    // Todas las listas mezcladas por turnos (una de cada bloque), así cada día sale variado.
    // Las marcadas como aprendidas salen de la rotación (se guardan en este navegador).
    var learned = load("aprendidas") || {}, total = 0;
    var groups = Object.keys(E).map(function (k) { return E[k] || []; }), list = [];
    var longest = Math.max.apply(null, groups.map(function (g) { return g.length; }));
    for (var i = 0; i < longest; i++) groups.forEach(function (g) { if (g[i]) { total++; if (!learned[g[i].en]) list.push(g[i]); } });
    if (!list.length) { card.hidden = true; return; }
    $("expr-title").textContent = "Expresiones útiles";
    var ul = $("expr-list"), today = dailySlice(list, CFG.palabrasPorDia || 20), rows = Math.ceil(today.length / 2);
    ul.innerHTML = "";
    ul.style.gridTemplateRows = "repeat(" + rows + ", auto)";
    today.forEach(function (w, i) {
      var li = document.createElement("li");
      if (i === 0 || i === rows) li.className = "col-top";
      li.innerHTML = '<span class="x-en"></span><span class="x-es"></span><button type="button" class="x-chk" aria-label="Marcar como aprendida">✓</button>';
      li.children[0].textContent = w.en;
      li.children[1].textContent = w.es;
      li.dataset.en = w.en;
      ul.appendChild(li);
    });
    var nL = Object.keys(learned).length;
    $("expr-count").textContent = nL ? "Aprendidas: " + nL + " de " + total + "." : "Marca con el círculo las que ya sepas: dejarán de salir.";
    $("expr-reset").hidden = !nL;
    card.hidden = false;
  }

  // Modo repaso: oculta traducciones; tocar una fila la muestra. El círculo marca/desmarca como aprendida.
  (function () {
    var btn = $("expr-mode"), ul = $("expr-list");
    function setMode(on) { btn.setAttribute("aria-pressed", String(on)); ul.classList.toggle("repaso", on); store("repaso", on); }
    setMode(!!load("repaso"));
    btn.addEventListener("click", function () { setMode(btn.getAttribute("aria-pressed") !== "true"); });
    ul.addEventListener("click", function (e) {
      var li = e.target.closest("li");
      if (!li) return;
      if (e.target.closest(".x-chk")) {
        var L = load("aprendidas") || {};
        if (L[li.dataset.en]) delete L[li.dataset.en]; else L[li.dataset.en] = Date.now();
        store("aprendidas", L);
        li.classList.toggle("learned", !!L[li.dataset.en]);
        var n = Object.keys(L).length;
        $("expr-count").textContent = n ? "Aprendidas: " + n + ". Desde mañana ya no saldrán." : "";
        $("expr-reset").hidden = !n;
        return;
      }
      if (ul.classList.contains("repaso")) li.classList.toggle("show");
    });
    $("expr-reset").addEventListener("click", function () {
      if (!window.confirm("¿Volver a incluir todas las expresiones marcadas como aprendidas?")) return;
      store("aprendidas", {}); renderExpr();
    });
  })();

  /* ---------- Utilidades de fechas para la cuenta atrás ---------- */
  // Medianoche (inicio del día) de una fecha en una zona horaria, como instante absoluto
  function midnightIn(tz, y, m, d) {
    var guess = Date.UTC(y, m - 1, d, 0, 0);
    for (var i = 0; i < 2; i++) {
      var p = localParts(tz, new Date(guess));
      var shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, 0);
      guess -= shown - Date.UTC(y, m - 1, d, 0, 0);
    }
    return guess;
  }
  function nthWeekday(y, r) {
    var dim = new Date(Date.UTC(y, r.mes, 0)).getUTCDate(), days = [];
    for (var d = 1; d <= dim; d++) if (new Date(Date.UTC(y, r.mes - 1, d)).getUTCDay() === r.diaSemana) days.push(d);
    return r.orden === -1 ? days[days.length - 1] : days[r.orden - 1];
  }
  function addMonths(t, n) {
    var d = new Date(t), day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + n);
    var dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, dim));
    return d.getTime();
  }
  function breakdown(from, to) {
    var months = 0, cur = from;
    while (addMonths(from, months + 1) <= to) months++;
    cur = addMonths(from, months);
    var rest = Math.floor((to - cur) / 1000);
    var weeks = Math.floor(rest / 604800); rest -= weeks * 604800;
    var days = Math.floor(rest / 86400); rest -= days * 86400;
    var hours = Math.floor(rest / 3600); rest -= hours * 3600;
    var mins = Math.floor(rest / 60), secs = rest - mins * 60;
    return [months, weeks, days, hours, mins, secs];
  }
  /* ---------- Carga y refresco ---------- */
  function loadWeatherAll() {
    loadDetail();
    $("updated").textContent = "Actualizado a las " + fmtTime(tzES) + " (" + CFG.espana.ciudadReloj + ")";
  }
  var lastLoad = Date.now();
  function loadAll() { lastLoad = Date.now(); loadWeatherAll(); renderCalendarToday(); renderDates(); renderLove(); renderExpr(); }
  $("refresh").addEventListener("click", loadAll);
  loadAll();
  showSplash();

  /* ---------- Aviso a pantalla completa en fechas clave ---------- */
  // Confeti con los colores de la bandera de España. No se lanza si el iPhone tiene "Reducir movimiento".
  function startConfetti(secs) {
    var canvas = $("confetti");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var ctx = canvas.getContext && canvas.getContext("2d");
    if (reduce || !ctx) return function () {};
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = canvas.clientWidth || window.innerWidth, H = canvas.clientHeight || window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var COLORS = ["#aa151b", "#f1bf00", "#c8102e", "#ffd200", "#aa151b", "#f1bf00"];
    var pieces = [], N = Math.round(Math.min(160, W * 0.35));
    for (var i = 0; i < N; i++) {
      pieces.push({
        x: Math.random() * W,
        y: -20 - Math.random() * H * 0.9,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        vx: -0.6 + Math.random() * 1.2,
        vy: 1.6 + Math.random() * 2.4,
        rot: Math.random() * Math.PI, vr: -0.12 + Math.random() * 0.24,
        sway: Math.random() * Math.PI * 2,
        color: COLORS[i % COLORS.length]
      });
    }
    var start = performance.now(), last = start, raf, running = true;
    var spawnEnd = secs * 1000 * 0.55;   // deja de reponer piezas pasada la mitad, para que se vacíe al final
    function frame(now) {
      if (!running) return;
      var dt = Math.min(2.5, (now - last) / 16.67); last = now;
      ctx.clearRect(0, 0, W, H);
      var alive = 0;
      pieces.forEach(function (p) {
        p.sway += 0.05 * dt;
        p.x += (p.vx + Math.sin(p.sway) * 0.6) * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        if (p.y > H + 20 && now - start < spawnEnd) { p.y = -20; p.x = Math.random() * W; }
        if (p.y <= H + 20) {
          alive++;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.scale(1, Math.cos(p.sway * 1.7));   // efecto de giro del papel
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
      });
      if (alive) raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return function () { running = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); };
  }

  function showSplash() {
    var S = CFG.aviso || {};
    if (S.activo === false) return;
    var msg = specialMessage();
    if (!msg) return;
    var withConfetti = messagesFor(0).some(function (x) { return x.confeti; });
    var secs = S.segundos || 5;
    var el = $("splash"), bar = $("splash-bar"), timer;
    $("splash-text").textContent = msg;
    el.hidden = false;
    document.body.classList.add("splash-open");
    // Barra de cuenta atrás
    bar.style.transition = "none";
    bar.style.transform = "scaleX(1)";
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        bar.style.transition = "transform " + secs + "s linear";
        bar.style.transform = "scaleX(0)";
      });
    });
    var stopConfetti = withConfetti ? startConfetti(secs) : function () {};
    function close() {
      clearTimeout(timer);
      stopConfetti();
      el.classList.add("closing");
      setTimeout(function () {
        el.hidden = true;
        el.classList.remove("closing");
        document.body.classList.remove("splash-open");
      }, 600);
    }
    el.addEventListener("click", close, { once: true });
    timer = setTimeout(close, secs * 1000);
  }
  setInterval(loadWeatherAll, 30 * 60 * 1000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - lastLoad > 10 * 60 * 1000) loadAll();
  });
})();
</script>
</body>
